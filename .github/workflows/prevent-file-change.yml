---
name: prevent-file-change

"on":
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  prevent-file-change:
    permissions:
      pull-requests: write
    uses: sous-chefs/.github/.github/workflows/prevent-file-change.yml@9.0.1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
